<!DOCTYPE html>
<html lang="vi-vn">

<head>
    <title>Trang chủ</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="{[#SITE_DESCRIPTION#]}">
    <meta name="keywords" content="{[#SITE_KEYWORDS#]}">
    <link rel="shortcut icon" href="" type="image/x-icon" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <!-- Slick CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />

    <!-- Fancybox CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/contact.css">
</head>


<body>
    <div id="header"></div>
    <main>
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <div class="container">
                <ol itemscope itemtype="https://schema.org/BreadcrumbList">
                    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                        <a itemprop="item" href="/"><span itemprop="name">Home</span></a>
                        <meta itemprop="position" content="1" />
                    </li>
                    <!-- <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                        <a itemprop="item" href="/shop"><span itemprop="name">Liên hệ</span></a>
                        <meta itemprop="position" content="2" />
                    </li> -->
                    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" aria-current="page">
                        <span itemprop="name">Liên hệ</span>
                        <meta itemprop="position" content="2" />
                    </li>
                </ol>
            </div>
        </nav>

        <div class="p-contact">
            <div class="container">
                <h1 class="ttl01 txt-center" style="display: none;">Liên Hệ</h1>
                <div class="p-contact-finish">
                    <img width="110" height="110" src="../assets/images/ic-success.png">
                    <div class="p-contact-finish__ttl">Gửi liên hệ thành công</div>
                    <p class="p-contact-finish__txt">Cảm ơn Quý khách đã gửi liên hệ tới NMI MART<br>Chúng tôi sẽ liên
                        hệ với bạn trong thời gian sớm nhất<br>
                        Tổng đài tư vấn: <span class="tel">0356858885</span></p>
                    <a href="../" class="btn-back">Trở về trang chủ</a>
                </div>
            </div>

        </div>
    </main>

    <div id="footer"></div>
    <div class="box-support">
        <div class="support-content">

            <a class="btn-support" href="https://zalo.me/">
                <img src="../assets/images/ic-zalo.png" alt="">
            </a>
            <a class="btn-support" href="">
                <img src="../assets/images/ic-messenger.png" alt="">
            </a>
            <a class="btn-support --tel" href="tel:">
                <img src="../assets/images/ic-call-3.png" alt="">
            </a>
            <div class="btn-top" id="backToTop">
                <img src="../assets/images/ic-top.png" alt="">
            </div>
        </div>
    </div>
    <script src="../assets/js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
    <script>
        fetch("../inc/header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header").innerHTML = data);

        fetch("../inc/footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
    <script src="../assets/js/script.js"></script>
</body>
